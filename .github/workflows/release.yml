name: Production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing master tag matching Gradle, e.g. v1.0.16
        required: true
        type: string
      publish:
        description: Publish immediately (false creates a draft with both assets)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build production APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require explicit release from master
        run: |
          test "$GITHUB_REF" = refs/heads/master || { echo 'Run this workflow from master after merging the release changes.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z tag.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Require tag on master and no existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'A release already exists for this tag. It will not be overwritten.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation, version and server contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/tests/docs.test.cjs scripts/tests/test-backend.test.cjs scripts/tests/studio-test.test.cjs scripts/tests/ui-kit.test.cjs scripts/tests/release.test.cjs google-apps-script/tests/http-contract.test.cjs
          node scripts/docs.cjs --check
          node -e 'const fs=require("fs"); const {readVersion}=require("./scripts/docs.cjs"); const v=readVersion(fs.readFileSync("app/build.gradle.kts","utf8")); if(process.env.RELEASE_TAG!=="v"+v.name) throw Error("Tag must match Gradle versionName");'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Test both Android configurations
        run: |
          bash ./gradlew :app:testDebugUnitTest -PciBuild=true --no-daemon --console=plain
          bash ./gradlew :app:testDebugUnitTest -PciBuild=false --no-daemon --console=plain
      - name: Build signed production APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          COFFEEPOINT_SIGNING_STORE_FILE: ${{ runner.temp }}/release-key.jks
          COFFEEPOINT_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          COFFEEPOINT_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          COFFEEPOINT_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          names = ['RELEASE_KEYSTORE_BASE64', 'COFFEEPOINT_SIGNING_STORE_PASSWORD', 'COFFEEPOINT_SIGNING_KEY_ALIAS', 'COFFEEPOINT_SIGNING_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Release signing secrets are not configured.')
          target = Path(os.environ['COFFEEPOINT_SIGNING_STORE_FILE'])
          target.write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True))
          target.chmod(0o600)
          PY
          bash ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify upgrade compatibility and prepare update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/previous-release.json"
          ASSET_ID=$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const a=r.assets.filter(x=>x.name.endsWith(".apk")); if(a.length!==1) throw Error("Expected one APK in latest published release"); console.log(a[0].id);' "$RUNNER_TEMP/previous-release.json")
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/previous.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-cert.txt"
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/previous-cert.txt"
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-badging.txt"
          "$TOOLS/aapt2" dump badging "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/previous-badging.txt"
          node scripts/prepare-release.cjs --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --certificate "$RUNNER_TEMP/current-cert.txt" --badging "$RUNNER_TEMP/current-badging.txt" \
            --previous-certificate "$RUNNER_TEMP/previous-cert.txt" --previous-badging "$RUNNER_TEMP/previous-badging.txt" \
            --out "$RUNNER_TEMP/release-assets"
      - name: Store verified release files
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove signing key
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/release-key.jks"

  release:
    name: Create GitHub Release with APK and update.json
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: release-assets
      - name: Validate files and create release draft
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('release-assets')
          info = json.loads((root / 'update.json').read_text())
          if os.environ['RELEASE_TAG'] != 'v' + info['versionName'] or info['applicationId'] != 'ru.coffeepoint':
              raise SystemExit('Unexpected release manifest.')
          name = info['apkName']
          if Path(name).name != name or not name.endswith('.apk'):
              raise SystemExit('Invalid APK filename.')
          apk = (root / name).read_bytes()
          if hashlib.sha256(apk).hexdigest() != info['sha256'] or len(apk) != info['apkSize']:
              raise SystemExit('Release artifact checksum mismatch.')
          if sorted(p.name for p in root.iterdir()) != sorted([name, 'update.json']):
              raise SystemExit('Unexpected release files.')
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Existing release will not be modified.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/update.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "CoffeePoint ${RELEASE_TAG#v}" --generate-notes
      - name: Publish only when explicitly requested
        if: ${{ inputs.publish }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Release summary
        run: |
          echo "### CoffeePoint $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          echo 'APK and update.json uploaded. No existing release was replaced.' >> "$GITHUB_STEP_SUMMARY"
